<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F0D">
<title>FlipScan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0F0D;--surface:#181A17;--surface-2:#2A2D27;--chip:#21231F;--tabbar:#121310;
    --ink:#F3F2EC;--muted:#A3A69C;--faint:#858979;--line:#2C2F2A;--line-strong:#2C2F2A;
    --accent:#D4F25A;--accent-hi:#E6FF8A;--accent-dim:#9FBE3A;--on-accent:#12140F;
    --teal:#5FE3D4;--teal-bg:#12312E;--teal-bar:#2A6B64;
    --green:#7EF0A6;--green-bg:#173322;--green-ic:#5BE08A;--green-txt:#B9E8C7;--chipg-bg:#1E2A1A;--chipg:#8FE07A;
    --blue:#8FB3FF;--good:#7EF0A6;--warn:#F5C542;--amber:#FB923C;--bad:#F06A6A;
    --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{max-width:440px;margin:0 auto;min-height:100dvh;padding:0 0 96px;position:relative}
  .mono{font-family:var(--mono)}

  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 20px 0}
  .brandwrap{display:flex;align-items:center;gap:10px}
  .brandwrap .name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
  .iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .iconbtn:hover{color:var(--ink)}

  .hero{padding:18px 20px 0}
  .hero h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.03em;margin:0}
  .hero .sub{color:var(--muted);font-size:14px;margin-top:8px}

  .viewfinder{margin:18px 20px 0;height:300px;border-radius:22px;background:var(--surface);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:var(--muted)}
  .viewfinder:active{transform:scale(.995)}
  .corner{position:absolute;width:26px;height:26px}
  .corner.tl{left:16px;top:16px;border-left:3px solid var(--accent);border-top:3px solid var(--accent);border-radius:6px 0 0 0}
  .corner.tr{right:16px;top:16px;border-right:3px solid var(--accent);border-top:3px solid var(--accent);border-radius:0 6px 0 0}
  .corner.bl{left:16px;bottom:16px;border-left:3px solid var(--accent);border-bottom:3px solid var(--accent);border-radius:0 0 0 6px}
  .corner.br{right:16px;bottom:16px;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);border-radius:0 0 6px 0}
  .viewfinder .vtext{font-size:14px;padding:0 24px;text-align:center}
  input[type=file]{display:none}

  .thumbstrip{margin:14px 20px 0;display:none;align-items:center;gap:8px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumbs img{width:52px;height:52px;object-fit:cover;border-radius:12px;background:var(--surface-2)}
  .photocount{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px;white-space:nowrap}
  .clearlink{background:none;border:0;color:var(--faint);font-size:12px;cursor:pointer;font-family:var(--mono)}
  .clearlink:hover{color:var(--bad)}

  .toggle{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:14px 20px 0;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
  .toggle button{height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:var(--body);font-weight:500;font-size:14px;cursor:pointer}
  .toggle button.on{background:var(--surface-2);color:var(--ink);font-weight:600}

  .scanbtn{margin:14px 20px 0;height:60px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:none;align-items:center;justify-content:center;gap:10px;cursor:pointer}
  .scanbtn:hover{background:var(--accent-hi)}
  .scanbtn:active{transform:translateY(1px)}

  .btn{display:block;width:100%;border:0;border-radius:14px;font-family:var(--body);font-weight:600;font-size:15px;padding:14px;cursor:pointer;text-align:center}
  .btn.primary{background:var(--accent);color:var(--on-accent);margin-top:14px}
  .btn.primary:hover{background:var(--accent-hi)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .btn:active{transform:translateY(1px)}

  .settings{margin:14px 20px 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:none}
  .settings h3{margin:0 0 4px;font-size:16px;font-family:var(--display);font-weight:800}
  .settings .note{color:var(--faint);font-size:12px;margin-bottom:12px;line-height:1.45}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .srow label{font-size:14px;color:var(--muted)}
  .srow input{width:96px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;text-align:right;font-family:var(--mono)}

  .status{margin:16px 20px 0;color:var(--muted);font-size:14px;display:none}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:9px}
  @keyframes s{to{transform:rotate(360deg)}}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--line);background:var(--tabbar);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;text-decoration:none;color:var(--faint);font-size:12px;font-weight:500;cursor:pointer;background:none;border:0;font-family:var(--body)}
  .tabbar a.on{color:var(--accent);font-weight:600}
  #results{padding:0 20px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{margin-top:14px;background:linear-gradient(180deg,var(--surface),#161a22);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 20px 50px -30px #000;animation:rise .28s ease both}
  .id-brand{font-family:var(--display);font-size:1.32rem;font-weight:700;letter-spacing:-.01em}
  .id-sub{color:var(--muted);font-size:.95rem;margin-top:2px}
  .conf{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .conf.high{background:#16331f;color:var(--good)} .conf.medium{background:#3a3417;color:var(--warn)} .conf.low{background:#3a2020;color:#e0707c}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:.73rem;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
  .chip .l{color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-size:.62rem;margin-right:3px}
  .notes{margin-top:12px;font-size:.87rem;color:var(--muted);line-height:1.5}
  .flag{margin-top:12px;background:#3a3417;color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.83rem;line-height:1.45}
  .nudge{margin-top:12px;background:#1d2029;border:1px dashed var(--line-strong);color:var(--muted);border-radius:10px;padding:10px 12px;font-size:.83rem;line-height:1.45}

  .band{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
  .band-h{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:600}
  .band-row{display:flex;align-items:baseline;gap:13px;margin-top:8px}
  .band-med{font-family:var(--display);font-size:2.3rem;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-.02em}
  .band-lohi{color:var(--muted);font-size:.86rem;line-height:1.35}
  .cbadge-row{margin-top:8px}
  .cbadge{display:inline-block;font-size:.66rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
  .cbadge.high{background:#16331f;color:var(--good)}
  .cbadge.med{background:#3a3417;color:var(--warn)}
  .cbadge.low{background:#3a2020;color:#e0707c}
  .examples{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .ex{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:7px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .08s}
  .ex:hover{border-color:var(--line-strong);transform:translateX(2px)}
  .ex img{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--line);flex:none}
  .ex .t{font-size:.8rem;line-height:1.2;max-height:2.4em;overflow:hidden}
  .ex .p{font-family:var(--display);font-size:.84rem;color:var(--accent);white-space:nowrap;margin-left:auto;font-weight:700}

  .paid{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
  .paid label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
  .paid .row{display:flex;align-items:center;gap:8px;margin-top:7px}
  .paid .cur{color:var(--muted);font-weight:700;font-size:1.05rem}
  .paid input{flex:1;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:12px;padding:12px 13px;font-size:1.05rem;font-weight:700;font-family:var(--display)}
  .paid input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .tagnote{margin-top:8px;font-size:.74rem;color:var(--accent);background:rgba(203,242,78,.08);border:1px solid rgba(203,242,78,.25);border-radius:8px;padding:7px 10px;line-height:1.4}
  .verdict{margin-top:11px;border-radius:14px;padding:15px 16px;font-family:var(--display);font-size:1.12rem;font-weight:700;display:none;animation:rise .22s ease both}
  .verdict small{display:block;font-family:var(--body);font-weight:400;font-size:.76rem;opacity:.9;margin-top:4px;line-height:1.45}
  .verdict.go{background:linear-gradient(145deg,#173a22,#143019);color:var(--good);box-shadow:0 10px 30px -16px rgba(74,222,128,.6)}
  .verdict.ok{background:#3a3417;color:var(--warn)}
  .verdict.thin{background:#3a2a16;color:var(--amber)} .verdict.pass{background:#3a2020;color:var(--bad)}
  .soldbtn{width:100%;margin-top:14px;background:rgba(203,242,78,.07);border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:12px;font-weight:700;font-size:.9rem;cursor:pointer;transition:background .15s}
  .soldbtn:hover{background:rgba(203,242,78,.14)}
  .soldbtn small{font-weight:400;color:var(--faint);margin-left:6px}
  .soldbtn:disabled{opacity:.6}
  .logbtn{width:100%;margin-top:10px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:12px;padding:12px;font-weight:700;font-size:.9rem;cursor:pointer;transition:border-color .15s}
  .logbtn:hover{border-color:var(--muted)}
  .logbtn:disabled{opacity:.6}
  .price-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .price-actions > button{margin-top:0}
  .price-actions .soldbtn small,.price-actions .vintedbtn small{display:block;margin-left:0;margin-top:2px;font-size:.64rem}
  .vintedband{margin-top:14px}
  .vintedband:empty{margin-top:0}
  .band.vinted{margin-top:0;border-top:0;background:rgba(47,212,198,.06);border:1px solid rgba(47,212,198,.35);border-radius:14px;padding:14px 15px}
  .vintedbtn{width:100%;margin-top:6px;background:rgba(47,212,198,.08);border:1px solid #2fd4c6;color:#2fd4c6;border-radius:12px;padding:12px;font-weight:700;font-size:.9rem;cursor:pointer;transition:background .15s}
  .vintedbtn:hover{background:rgba(47,212,198,.16)}
  .vintedbtn small{font-weight:400;color:var(--faint);margin-left:6px}
  .vintedbtn:disabled{opacity:.6}
  .lensbtn,.webbtn{width:100%;margin-top:10px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:12px;padding:12px;font-weight:700;font-size:.9rem;cursor:pointer;transition:border-color .15s}
  .lensbtn{margin-top:14px}
  .lensbtn:hover,.webbtn:hover{border-color:var(--accent)}
  .lensbtn:disabled,.webbtn:disabled{opacity:.6}
  .lensresults,.webresults{margin-top:12px}
  .lensresults:empty,.webresults:empty{margin-top:0}

  .maxbuy{margin-top:14px;background:rgba(203,242,78,.07);border:1px solid var(--line-strong);border-radius:14px;padding:13px 15px;font-size:1rem;font-weight:700}
  .maxbuy b{font-family:var(--display);font-size:1.3rem;color:var(--accent)}
  .maxbuy.none b{color:var(--bad)}
  .maxbuy span{font-weight:400;color:var(--muted);font-size:.86rem}
  .maxbuy small{display:block;font-weight:400;color:var(--faint);font-size:.72rem;margin-top:5px;line-height:1.45}

  .dig{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
  .dig > summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:.9rem;padding:9px 2px;list-style:none;user-select:none}
  .dig > summary::-webkit-details-marker{display:none}
  .dig > summary::before{content:"▸";color:var(--faint);margin-right:7px;display:inline-block;transition:transform .15s}
  .dig[open] > summary::before{transform:rotate(90deg)}
  .dig[open] > summary{color:var(--ink)}
  .dig .soldbtn{margin-top:6px}

  .links{margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .links a{text-align:center;text-decoration:none;font-weight:700;font-size:.82rem;padding:12px 6px;border-radius:12px;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface-2);transition:border-color .15s,transform .08s}
  .links a:hover{border-color:var(--accent);transform:translateY(-1px)}
  .links a small{display:block;font-weight:400;color:var(--faint);font-size:.63rem;margin-top:2px}
  .err{margin-top:14px;background:#3a2020;color:#e0707c;border-radius:12px;padding:12px;font-size:.85rem}
  footer{margin-top:28px;color:var(--faint);font-size:.72rem;text-align:center;line-height:1.5}

  /* ===== result screen (redesign) ===== */
  .rcard{animation:rise .28s ease both;padding:0 0 10px}
  .rhead{display:flex;align-items:center;justify-content:space-between;padding:4px 0 0}
  .rback{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--ink);cursor:pointer}
  .rtime{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
  .idrow{display:flex;gap:14px;align-items:center;margin-top:6px}
  .idthumb{width:64px;height:64px;border-radius:16px;background:var(--surface-2) center/cover no-repeat;flex:none}
  .idmeta{flex:1;min-width:0}
  .idbrand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.05}
  .idsub{color:var(--muted);font-size:14px;margin-top:2px}
  .idchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .idchip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
  .idchip.sure{background:var(--chipg-bg);color:var(--chipg);font-weight:600}
  .idchip.warn{background:#3a3417;color:var(--warn);font-weight:600}
  .rnote{color:var(--muted);font-size:13px;margin-top:12px;line-height:1.5}
  .rflag{display:flex;gap:8px;align-items:flex-start;color:var(--warn);background:#2a2713;border-radius:10px;padding:9px 11px;font-size:13px;margin-top:10px}
  .rnudge{display:flex;gap:8px;align-items:flex-start;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:10px}

  .paycard{position:relative;background:var(--accent);color:var(--on-accent);border-radius:22px;padding:20px 22px 18px;margin-top:18px}
  .paycard.skip{background:#3A2020;color:#F2C0C0}
  .paydot{position:absolute;right:22px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--bg)}
  .paylabel{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em}
  .payval{font-family:var(--mono);font-weight:700;font-size:72px;line-height:1;letter-spacing:-.04em;margin-top:6px}
  .paysub{border-top:2px dashed rgba(18,20,15,.35);margin-top:14px;padding-top:12px;font-size:14px;font-weight:500}
  .paycard.skip .paysub{border-top:0;margin-top:8px;padding-top:0}

  .rlabelrow{display:flex;align-items:baseline;justify-content:space-between;margin-top:22px}
  .rlabel{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
  .rhint{font-size:12px;color:var(--faint)}
  .srctabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:10px}
  .srctabs button{height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:var(--body);font-weight:500;font-size:13px;cursor:pointer}
  .srctabs button.on{background:var(--surface-2);color:var(--ink);font-weight:600}

  .valuecard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
  .vtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .vmid{font-family:var(--mono);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em}
  .vchip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .vchip .dot{width:7px;height:7px;border-radius:50%}
  .vchip.high{background:var(--chipg-bg);color:var(--chipg)}.vchip.high .dot{background:var(--chipg)}
  .vchip.med{background:#3a3417;color:var(--warn)}.vchip.med .dot{background:var(--warn)}
  .vchip.low{background:#3a2020;color:#e0707c}.vchip.low .dot{background:#e0707c}
  .rangebar{position:relative;height:34px;margin-top:18px}
  .rangebar .track{position:absolute;left:0;right:0;top:13px;height:8px;border-radius:4px;background:var(--line)}
  .rangebar .rfill{position:absolute;left:18%;right:18%;top:13px;height:8px;border-radius:4px}
  .rangebar .rmark{position:absolute;top:6px;width:4px;height:22px;border-radius:2px;transform:translateX(-50%)}
  .rlabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .vnote{color:var(--faint);font-size:12px;margin-top:12px;line-height:1.45}
  .vfetchnote{color:var(--muted);font-size:14px;line-height:1.45}
  .vfetchbtn{width:100%;margin-top:12px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--body);font-weight:600;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px}
  .vfetchbtn:hover{border-color:var(--teal)}
  .vfetchbtn small{font-weight:400;color:var(--faint);font-size:12px}
  .vfetchbtn:disabled{opacity:.6}
  .vempty{color:var(--muted);font-size:14px;padding:6px 0}
  .compscroll{display:flex;gap:10px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
  .compscroll::-webkit-scrollbar{display:none}
  .compcard{width:116px;flex:none;text-decoration:none;color:var(--ink)}
  .compcard .ph{height:116px;border-radius:14px;background:var(--surface-2) center/cover no-repeat}
  .compcard .cp{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:7px}
  .compcard .cd{font-size:12px;color:var(--faint)}

  .paidwrap{margin-top:24px}
  .paidbox{display:flex;align-items:center;gap:10px;margin-top:8px;height:60px;border-radius:16px;background:var(--surface);border:2px solid var(--accent);padding:0 16px}
  .paidbox .cur{font-family:var(--mono);font-size:24px;color:var(--muted)}
  .paidbox input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:26px;outline:none}
  .tagflag{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}

  .verdictcard{display:none;align-items:center;gap:14px;margin-top:12px;border-radius:18px;padding:16px 18px;animation:rise .2s ease both}
  .verdictcard .vico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#0E1A12}
  .verdictcard .vtitle{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
  .verdictcard .vbody{font-size:14px;margin-top:1px}
  .verdictcard.go{background:var(--green-bg)}.verdictcard.go .vico{background:var(--green-ic)}.verdictcard.go .vtitle{color:var(--green)}.verdictcard.go .vbody{color:var(--green-txt)}
  .verdictcard.ok{background:#1f2a16}.verdictcard.ok .vico{background:#B8D86A}.verdictcard.ok .vtitle{color:#C7E07A}.verdictcard.ok .vbody{color:#B6C79A}
  .verdictcard.thin{background:#2f2713}.verdictcard.thin .vico{background:var(--warn);color:#2a2411}.verdictcard.thin .vtitle{color:var(--warn)}.verdictcard.thin .vbody{color:#D8C08A}
  .verdictcard.pass{background:#2f1a1a}.verdictcard.pass .vico{background:#E88A8A;color:#2a1111}.verdictcard.pass .vtitle{color:#F0A6A6}.verdictcard.pass .vbody{color:#D8AEAE}

  .digsec{margin-top:22px}
  .diglabel{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
  .digrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
  .digrow button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--body);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}
  .digrow button:hover{border-color:var(--accent)}
  .digrow button:disabled{opacity:.6}
  .lensresults,.webresults{margin-top:4px}.lensresults:empty,.webresults:empty{margin:0}
  .examples{margin-top:10px;display:flex;flex-direction:column;gap:7px}
  .ex{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:7px;text-decoration:none;color:var(--ink)}
  .ex img{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--line);flex:none}
  .ex .t{font-size:12px;line-height:1.25}
  .ex .p{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;margin-left:auto;font-weight:700}
  .links{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .links a{text-align:center;text-decoration:none;font-weight:600;font-size:13px;padding:11px 6px;border-radius:12px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
  .links a:hover{border-color:var(--accent);color:var(--ink)}
  .logbar{display:flex;gap:10px;margin-top:24px}
  .logbtn{flex:1;min-height:58px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:19px;cursor:pointer}
  .logbtn:hover{background:var(--accent-hi)}
  .logbtn.saved{background:var(--green-ic)}
  .logbtn:disabled{opacity:.7}
  .scanagain{width:58px;height:58px;flex:none;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brandwrap">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 9 L11 3 H26 V27 H11 L4 21 Z" fill="#D4F25A"/><circle cx="11" cy="15" r="2.6" fill="#0E0F0D"/></svg>
      <div class="name">FlipScan</div>
    </div>
    <button class="iconbtn" id="gear" aria-label="Cost settings" title="Costs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>

  <div class="hero">
    <h1>What's it<br>worth to you?</h1>
    <div class="sub">Get the label in shot — it tells us the brand and age.</div>
  </div>

  <div class="settings" id="settings">
    <h3>Your costs</h3>
    <div class="note">We take these off the sale price to work out real profit. On Vinted the buyer pays postage, so leave that at 0.</div>
    <div class="srow"><label>Selling fee %</label><input id="sFee" type="number" inputmode="decimal"></div>
    <div class="srow"><label>Postage you cover €</label><input id="sPost" type="number" inputmode="decimal"></div>
    <div class="srow"><label>Packaging €</label><input id="sPack" type="number" inputmode="decimal"></div>
    <div class="srow"><label>Don't bother under €</label><input id="sFloor" type="number" inputmode="decimal"></div>
    <button class="btn primary" id="saveSettings">Save</button>
    <button class="btn ghost" id="resetCode">Change access code</button>
  </div>

  <label class="viewfinder" for="file">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A3A69C" stroke-width="1.5" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span class="vtext">Tap to take photos or pick from gallery</span>
  </label>
  <input id="file" type="file" accept="image/*" multiple>

  <div class="thumbstrip" id="thumbstrip">
    <div class="thumbs" id="thumbs"></div>
    <div class="photocount"><span id="photocount">0 PHOTOS</span><button class="clearlink" id="clear">CLEAR</button></div>
  </div>

  <div class="toggle" id="toggle">
    <button id="mOne" class="on" data-mode="one-item">One item</button>
    <button id="mMany" data-mode="items">Several items</button>
  </div>

  <button class="scanbtn" id="scan">Scan it<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12140F" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

  <div class="status" id="status"><span class="spin"></span><span id="statusText">Reading…</span></div>
  <div id="results"></div>

  <nav class="tabbar">
    <a class="on" id="tabScan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg>Scan</a>
    <a href="log.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Flips</a>
    <a id="tabCosts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Costs</a>
  </nav>
</div>

<script>
const $ = (id) => document.getElementById(id);
let files = [], mode = "one-item";
const RATE = { GBP: 1.17, USD: 0.92, EUR: 1 };
const DEFAULTS = { fee: 0, post: 0, pack: 0.5, floor: 5 };

// ---------- settings ----------
function costs(){ try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("flipscan_costs")||"{}") }; } catch { return { ...DEFAULTS }; } }
function loadSettings(){ const c=costs(); $("sFee").value=c.fee; $("sPost").value=c.post; $("sPack").value=c.pack; $("sFloor").value=c.floor; }
function toggleSettings(){ const s=$("settings"); const open=s.style.display==="block"; s.style.display=open?"none":"block"; if(!open){ loadSettings(); s.scrollIntoView({behavior:"smooth",block:"nearest"}); } }
$("gear").addEventListener("click", toggleSettings);
$("tabCosts").addEventListener("click", toggleSettings);
$("tabScan").addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
$("saveSettings").addEventListener("click", ()=>{
  const c={ fee:num($("sFee").value,0), post:num($("sPost").value,0), pack:num($("sPack").value,0), floor:num($("sFloor").value,5) };
  try{ localStorage.setItem("flipscan_costs", JSON.stringify(c)); }catch{}
  const b=$("saveSettings"), t=b.textContent;
  b.textContent="Saved ✓"; b.style.background="var(--green-ic)"; b.style.color="#0E1A12";
  setTimeout(()=>{ b.textContent=t; b.style.background=""; b.style.color=""; $("settings").style.display="none"; }, 900);
});
$("resetCode").addEventListener("click", ()=>{ localStorage.removeItem("flipscan_secret"); askSecret(); });
function num(v,d){ const n=parseFloat(v); return isFinite(n)?n:d; }

// ---------- access code ----------
function getSecret(){ return localStorage.getItem("flipscan_secret")||""; }
function askSecret(){ const s=prompt("Enter the FlipScan access code"); if(s){ localStorage.setItem("flipscan_secret", s.trim()); } return getSecret(); }

// ---------- capture ----------
$("file").addEventListener("change", async (e)=>{ for(const f of e.target.files) files.push(await resize(f,1568,0.82)); e.target.value=""; renderThumbs(); });
$("clear").addEventListener("click", ()=>{ files=[]; renderThumbs(); $("results").innerHTML=""; });
$("mOne").addEventListener("click", ()=>setMode("one-item"));
$("mMany").addEventListener("click", ()=>setMode("items"));
$("scan").addEventListener("click", scan);
function setMode(m){ mode=m; $("mOne").classList.toggle("on",m==="one-item"); $("mMany").classList.toggle("on",m==="items"); }
function renderThumbs(){
  $("thumbs").innerHTML = files.map(d=>`<img src="${d}" alt="">`).join("");
  const has=files.length>0;
  $("thumbstrip").style.display = has?"flex":"none";
  $("photocount").textContent = files.length+" PHOTO"+(files.length===1?"":"S");
  $("scan").style.display = has?"flex":"none";
  $("toggle").style.display = files.length>1?"grid":"none";
}

async function scan(){
  if(!getSecret() && !askSecret()) return;
  $("results").innerHTML=""; $("status").style.display="block";
  try {
    if(mode==="items" && files.length>1){
      $("statusText").textContent = `Looking at ${files.length} things…`;
      await Promise.all(files.map(async (img,i)=>{
        const card=document.createElement("div"); $("results").appendChild(card);
        try { renderCard(await post([img]), card, i+1, img); }
        catch(e){ card.className="err"; card.textContent=`Item ${i+1}: ${e.message}`; }
      }));
    } else {
      $("statusText").textContent = files.length>1 ? "Looking at it…" : "Looking…";
      const card=document.createElement("div"); $("results").appendChild(card);
      renderCard(await post(files), card, undefined, files[0]);
    }
  } catch(err){
    const d=document.createElement("div"); d.className="err"; d.textContent="Couldn't scan: "+err.message; $("results").appendChild(d);
  } finally { $("status").style.display="none"; }
}

async function post(images){
  const res = await fetch("/api/scan",{ method:"POST", headers:{ "content-type":"application/json", "x-flipscan-secret":getSecret() }, body: JSON.stringify({ images }) });
  if(res.status===401){ localStorage.removeItem("flipscan_secret"); throw new Error("Access code rejected — tap Scan again to re-enter."); }
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(prettyErr(data.error) || ("HTTP "+res.status));
  return data;
}
function prettyErr(e){ return ({ identify_timeout:"the AI timed out — try again", identify_truncated:"the AI reply was cut off — try again", identify_failed:"couldn't read the photo", too_many_images:"max 5 photos per item", image_too_large:"a photo was too big", payload_too_large:"too much image data", bad_image_format:"unsupported image", unauthorized:"wrong access code", server_misconfigured:"app not configured (keys)", server_error:"server error", sold_quota:"monthly sold-lookups used up (resets next month)", sold_auth:"sold-price key invalid", sold_failed:"sold lookup failed", sold_timeout:"sold lookup timed out", no_query:"nothing to search", log_not_configured:"scan log not set up (Upstash keys)", lens_not_configured:"shop search not set up (SerpApi/Upstash keys)", lens_failed:"shop search failed", lens_timeout:"shop search timed out", lens_quota:"monthly shop-searches used up (resets next month)", web_not_configured:"reverse image search not set up (Vision key)", web_failed:"reverse image search failed", web_timeout:"reverse image search timed out", vinted_not_configured:"Vinted lookup not set up (Apify key)" })[e] || e; }

function resize(file,max,q){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ let {width:w,height:h}=img; if(Math.max(w,h)>max){ const r=max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r);} const c=document.createElement("canvas"); c.width=w;c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); res(c.toDataURL("image/jpeg",q)); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmt(v,cur){ if(v==null) return "—"; const sym=cur==="EUR"?"€":cur==="USD"?"$":cur==="GBP"?"£":""; return sym+Math.round(v); }
// Evidence badge: how trustworthy the number is, from comp count + spread.
function compBadge(conf,count,tight){
  const n = `${count} comp${count===1?"":"s"}`;
  if(conf==="high") return `<span class="cbadge high">✓ Based on ${n} · consistent</span>`;
  if(conf==="medium") return `<span class="cbadge med">Based on ${n}${count>=8&&!tight?" · prices vary a lot":""}</span>`;
  return `<span class="cbadge low">⚠ Only ${n} — treat as a guess</span>`;
}
// Every comp a tappable link.
function examplesHtml(list){
  if(!list||!list.length) return "";
  return `<div class="examples">`+list.map(ex=>`<a class="ex" href="${esc(ex.url||'#')}" target="_blank" rel="noopener">${ex.image?`<img src="${esc(ex.image)}" alt="">`:`<span style="width:42px"></span>`}<span class="t">${esc(ex.title)}</span><span class="p">${esc(ex.price)}</span></a>`).join("")+`</div>`;
}

// ---- result-screen helpers (icons + source model) ----
function chevSvg(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';}
function scanSvg(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg>';}
function lensSvg(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>';}
function globeSvg(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>';}
function checkSvg(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>';}
function xSvg(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';}
function warnSvg(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>';}
function warnMini(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>';}
function camMini(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>';}
function compExamples(list, domain){ return (list||[]).map(ex=>({ price: ex.price||"", url: ex.url||"#", image: ex.image||null, domain })); }
function srcFromComps(id, c){
  const hasComps = c && !c.error && c.count>0 && c.anchor!=null;
  if(hasComps && c.count>=3){
    const rate=RATE[c.currency]||1;
    return { key:"asking", label:"eBay asking", accent:"var(--accent)", fill:"#7A8A2E", state:"ready",
      mid:c.anchor*rate, low:c.low*rate, high:c.high*rate, count:c.count, confidence:c.confidence, tight:c.tight,
      basis:"what they're asking", priceSource:"eBay asking",
      note:(c.visual?"Visually-matched eBay listings — ":"eBay ")+"asking prices, priced off the lower third.",
      examples: compExamples(c.examples,"ebay.co.uk") };
  }
  const e=id.estimated_resale_eur||{}, lo=Number(e.low)||0, hi=Number(e.high)||lo;
  if(lo||hi) return { key:"asking", label:"Estimate", accent:"var(--accent)", fill:"#7A8A2E", state:"ready", isEstimate:true,
    mid:(lo+hi)/2, low:lo, high:hi, count:hasComps?c.count:0, confidence:"low", tight:false,
    basis:"a rough guess", priceSource:"AI", note:"AI estimate — no solid comps yet. Treat as a guess; load a real source.",
    examples: hasComps?compExamples(c.examples,"ebay.co.uk"):[] };
  return { key:"asking", label:"Estimate", accent:"var(--accent)", fill:"#7A8A2E", state:"empty", isEstimate:true,
    mid:null, basis:"", priceSource:"AI", count:0, confidence:"low", note:"Couldn't price this one — load a real source or use the links.", examples:[] };
}
function idChipsHtml(id, conf){
  let h = conf==="high"?'<span class="idchip sure">ID sure</span>':conf==="medium"?'<span class="idchip">ID likely</span>':'<span class="idchip warn">ID unsure</span>';
  if(id.size&&id.size!=="unknown") h+=`<span class="idchip">size ${esc(id.size)}</span>`;
  if(id.key_features){ const kf=String(id.key_features).split(/[,;]/)[0].trim(); if(kf) h+=`<span class="idchip">${esc(kf.length>22?kf.slice(0,22)+"…":kf)}</span>`; }
  return h;
}
function confChipHtml(s){
  const c=s.confidence||"low", n=s.count||0, cls=c==="high"?"high":c==="medium"?"med":"low";
  const txt = c==="high"?`${n} comps · tight`:c==="medium"?(n>=8?`${n} comps · varied`:`${n} comps`):(n>0?`${n} comps · guess`:"a guess");
  return `<div class="vchip ${cls}"><span class="dot"></span>${txt}</div>`;
}
function rangeMarkerPct(s){ if(s.low==null||s.high==null||s.high<=s.low) return 50; return Math.max(6,Math.min(94,(s.mid-s.low)/(s.high-s.low)*100)); }
function compCardsHtml(list){
  if(!list||!list.length) return "";
  return `<div class="compscroll">`+list.map(ex=>`<a class="compcard" href="${esc(ex.url)}" target="_blank" rel="noopener"><div class="ph"${ex.image?` style="background-image:url('${esc(ex.image)}')"`:""}></div><div class="cp">${esc(ex.price||"")}</div><div class="cd">${esc(ex.domain||"")}</div></a>`).join("")+`</div>`;
}
function valueCardHtml(s){
  if(s.state==="unfetched") return `<div class="vfetchnote">${esc(s.fetchNote)}</div><button class="vfetchbtn" data-src="${s.key}">${esc(s.fetchLabel)}<small>${esc(s.fetchQuota)}</small></button>`;
  if(s.state==="empty"||s.mid==null) return `<div class="vempty">${esc(s.note||"No data for this source.")}</div>`;
  const mk=rangeMarkerPct(s);
  return `<div class="vtop"><div class="vmid" style="color:${s.accent}">${fmt(s.mid,"EUR")}</div>${confChipHtml(s)}</div>
    <div class="rangebar"><div class="track"></div><div class="rfill" style="background:${s.fill}"></div><div class="rmark" style="left:${mk}%;background:${s.accent}"></div></div>
    <div class="rlabels"><span>${fmt(s.low,"EUR")}</span><span>most sit here</span><span>${fmt(s.high,"EUR")}</span></div>
    <div class="vnote">${esc(s.note)}</div>${compCardsHtml(s.examples)}`;
}

function renderCard(data, el, n, img){
  const id = data.identity||{};
  const q = encodeURIComponent(id.search_query || [id.brand,id.item_type,id.era].filter(Boolean).join(" "));
  const conf = (id.confidence||"low").toLowerCase();
  const c = data.comps;

  const query = id.search_query || [id.brand,id.item_type,id.era].filter(Boolean).join(" ");
  const now=new Date(), ts=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const srcs = {
    asking: srcFromComps(id, c),
    sold:   { key:"sold", label:"eBay sold", accent:"var(--green)", fill:"#2E7D4F", state:"unfetched", fetchLabel:"Show real eBay sold prices", fetchQuota:"1 of 100 this month", fetchNote:"What this actually sold for on eBay.", examples:[] },
    vinted: { key:"vinted", label:"Vinted IE", accent:"var(--teal)", fill:"var(--teal-bar)", state:"unfetched", fetchLabel:"Show Vinted (IE) prices", fetchQuota:"your market · ~€0.03", fetchNote:"What sellers ask on Vinted — your market.", examples:[] },
  };
  let viewed="asking";
  let resaleEur=null, basis="", cur="EUR", priceSource="AI", bandLow=null, bandHigh=null;
  function drive(s){ resaleEur=s.mid; basis=s.basis; priceSource=s.priceSource; bandLow=s.low; bandHigh=s.high; }
  if(srcs.asking.state==="ready") drive(srcs.asking);

  let extra="";
  if(id.notes) extra += `<div class="rnote">${esc(id.notes)}</div>`;
  if(id.authenticity_flags && id.authenticity_flags.toLowerCase()!=="none") extra += `<div class="rflag">${warnMini()} ${esc(id.authenticity_flags)}</div>`;
  if(conf==="low") extra += `<div class="rnudge">${camMini()} Not sure on this one — a close-up of the label would nail it.</div>`;

  el.className="rcard";
  el.innerHTML = `
    <div class="rhead"><button class="rback" aria-label="Back to scan">${chevSvg()}</button><div class="rtime">SCAN · ${ts}</div><span style="width:36px"></span></div>
    <div class="idrow">
      <div class="idthumb"${img?` style="background-image:url('${img}')"`:""}></div>
      <div class="idmeta">
        <div class="idbrand">${n?`<span style="color:var(--faint)">#${n} </span>`:""}${esc(id.brand||"Unknown")}</div>
        <div class="idsub">${esc(id.item_type||"")}${id.era&&id.era!=="unknown"?" · "+esc(id.era):""}</div>
        <div class="idchips">${idChipsHtml(id, conf)}</div>
      </div>
    </div>
    ${extra}
    <div class="paycard"></div>
    <div class="rlabelrow"><span class="rlabel">RESALE VALUE</span><span class="rhint">tap a source</span></div>
    <div class="srctabs">
      <button data-src="asking">${srcs.asking.isEstimate?"Estimate":"eBay asking"}</button>
      <button data-src="sold">eBay sold</button>
      <button data-src="vinted">Vinted IE</button>
    </div>
    <div class="valuecard"></div>
    <div class="paidwrap"><label class="rlabel">WHAT YOU PAID</label>
      <div class="paidbox"><span class="cur">€</span><input type="number" inputmode="decimal" placeholder="0"><span class="tagflag" style="display:none">from tag</span></div>
    </div>
    <div class="verdictcard"></div>
    <div class="digsec">
      <div class="diglabel">NOT SURE? DIG DEEPER</div>
      <div class="digrow"><button class="lensbtn">${lensSvg()}Google Lens</button><button class="webbtn">${globeSvg()}Search the web</button></div>
      <div class="lensresults"></div><div class="webresults"></div>
      <div class="links">
        <a href="https://www.ebay.co.uk/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1" target="_blank" rel="noopener">eBay sold</a>
        <a href="https://www.vinted.ie/catalog?search_text=${q}&order=price_high_to_low" target="_blank" rel="noopener">Vinted</a>
        <a href="https://www.depop.com/search/?q=${q}" target="_blank" rel="noopener">Depop</a>
      </div>
    </div>
    <div class="logbar"><button class="logbtn">Log it as bought</button><button class="scanagain" aria-label="Scan another">${scanSvg()}</button></div>`;

  const input = el.querySelector(".paidbox input"), vEl = el.querySelector(".verdictcard");
  const tabsEl = el.querySelector(".srctabs"), valEl = el.querySelector(".valuecard"), payEl = el.querySelector(".paycard");

  function renderValue(){
    const s = srcs[viewed];
    valEl.innerHTML = valueCardHtml(s);
    tabsEl.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.src===viewed));
    const fb = valEl.querySelector(".vfetchbtn");
    if(fb) fb.addEventListener("click", ()=>fetchSource(fb.dataset.src, fb));
  }
  function updateVerdict(){
    const cost = parseFloat(input.value);
    if(!cost || resaleEur==null){ vEl.style.display="none"; return; }
    const s = costs();
    const afterCosts = resaleEur - resaleEur*(s.fee/100) - s.post - s.pack;
    const net = afterCosts - cost, mult = afterCosts / cost;
    let tier,label,ico;
    if(net < s.floor){ tier="pass"; label="Leave it"; ico=xSvg(); }
    else if(mult>=2.5){ tier="go"; label="Grab it"; ico=checkSvg(); }
    else if(mult>=1.6){ tier="ok"; label="Worth it"; ico=checkSvg(); }
    else if(mult>=1.15){ tier="thin"; label="A bit tight"; ico=warnSvg(); }
    else { tier="pass"; label="Leave it"; ico=xSvg(); }
    const sub = net<s.floor ? `Under your €${s.floor} floor — you'd keep about €${Math.round(net)}` : `You'd keep about €${Math.round(net)} · ${mult.toFixed(1)}× your money`;
    vEl.className="verdictcard "+tier; vEl.style.display="flex";
    vEl.innerHTML = `<div class="vico">${ico}</div><div><div class="vtitle">${label}</div><div class="vbody">${sub}</div></div>`;
  }
  function updateMaxBuy(){
    if(resaleEur==null){ payEl.style.display="none"; return; }
    const s = costs();
    const afterCosts = resaleEur - resaleEur*(s.fee/100) - s.post - s.pack;
    const maxBuy = Math.floor(Math.min(afterCosts/1.6, afterCosts - s.floor));
    payEl.style.display="block";
    if(maxBuy < 1){
      payEl.className="paycard skip";
      payEl.innerHTML = `<div class="paylabel">SKIP IT</div><div class="paysub">Won't clear your €${s.floor} profit even if it were free.</div>`;
    } else {
      payEl.className="paycard";
      payEl.innerHTML = `<div class="paydot"></div><div class="paylabel">PAY UP TO</div><div class="payval">€${maxBuy}</div><div class="paysub">and it's still worth flipping after postage and packaging.</div>`;
    }
  }
  async function fetchSource(key, btn){
    const label=btn.innerHTML; btn.disabled=true; btn.textContent="Loading…";
    try{
      if(key==="vinted"){
        const r=await fetch("/api/vinted",{method:"POST",headers:{"content-type":"application/json","x-flipscan-secret":getSecret()},body:JSON.stringify({query})});
        if(r.status===401){ localStorage.removeItem("flipscan_secret"); throw new Error("Access code rejected — scan again to re-enter."); }
        const d=await r.json(); if(!r.ok||d.error) throw new Error(prettyErr(d.error)||"Vinted lookup failed");
        if(!d.count){ srcs.vinted.state="empty"; srcs.vinted.note="No Vinted listings found."; renderValue(); return; }
        const cc=(d.country||"ie").toUpperCase();
        Object.assign(srcs.vinted,{ state:"ready", mid:d.anchor, low:d.low, high:d.high, count:d.count, confidence:d.confidence, tight:d.tight, basis:`what Vinted ${cc} sellers ask`, priceSource:"Vinted", note:`Vinted ${cc} asking prices — priced off the lower third.`, examples:compExamples(d.examples,"vinted."+(d.country||"ie")) });
      } else {
        const r=await fetch("/api/sold",{method:"POST",headers:{"content-type":"application/json","x-flipscan-secret":getSecret()},body:JSON.stringify({query})});
        if(r.status===401){ localStorage.removeItem("flipscan_secret"); throw new Error("Access code rejected — scan again to re-enter."); }
        const d=await r.json(); if(!r.ok||d.error) throw new Error(prettyErr(d.error)||"sold lookup failed");
        if(!d.count){ srcs.sold.state="empty"; srcs.sold.note="No recent eBay sales found."; renderValue(); return; }
        const ccy=d.currency, rate=RATE[ccy]||1;
        const sconf=d.count>=8 ? ((d.high!=null&&d.low!=null&&d.median>0&&(d.high-d.low)<=d.median*1.5)?"high":"medium") : (d.count>=3?"medium":"low");
        Object.assign(srcs.sold,{ state:"ready", mid:d.median*rate, low:d.low*rate, high:d.high*rate, count:d.count, confidence:sconf, tight:sconf==="high", basis:"what it actually sold for", priceSource:"eBay sold", note:"Real eBay sold prices.", examples:compExamples(d.examples,"ebay sold") });
      }
      if(viewed===key){ renderValue(); drive(srcs[key]); updateMaxBuy(); updateVerdict(); }
      else renderValue();
    }catch(e){ btn.disabled=false; btn.innerHTML=label; alert(e.message); }
  }

  tabsEl.querySelectorAll("button").forEach(b=> b.addEventListener("click", ()=>{
    viewed=b.dataset.src; const s=srcs[viewed]; renderValue();
    if(s.state==="ready"){ drive(s); updateMaxBuy(); updateVerdict(); }
  }));

  renderValue(); updateMaxBuy();
  input.addEventListener("input", updateVerdict);
  el.querySelector(".rback").addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
  el.querySelector(".scanagain").addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));

  // Price-tag reading: if the AI read a shop/charity price sticker, prefill "what you paid".
  if(id.price_tag_eur){ input.value=id.price_tag_eur; const f=el.querySelector(".tagflag"); if(f) f.style.display="inline"; updateVerdict(); }

  // (Vinted IE + eBay sold prices are fetched on demand via fetchSource() into the source tabs above.)

  // On-demand priced shop matches (SerpApi Google Lens) — needs the original photo.
  const lensBtn = el.querySelector(".lensbtn"), lensOut = el.querySelector(".lensresults");
  lensBtn.addEventListener("click", async ()=>{
    if(!img){ alert("No photo saved for this card — scan again to use shop search."); return; }
    lensBtn.disabled=true; const o=lensBtn.innerHTML; lensBtn.textContent="Searching shops…";
    try {
      const r = await fetch("/api/lens",{ method:"POST", headers:{ "content-type":"application/json", "x-flipscan-secret":getSecret() }, body: JSON.stringify({ image: img }) });
      if(r.status===401){ localStorage.removeItem("flipscan_secret"); throw new Error("Access code rejected — scan again to re-enter."); }
      const d = await r.json();
      if(!r.ok || d.error) throw new Error(prettyErr(d.error) || "shop search failed");
      if(!d.matches || !d.matches.length){ lensBtn.disabled=false; lensBtn.textContent="No shop matches found"; return; }
      lensOut.innerHTML = `<div class="diglabel" style="margin:12px 0 8px">SAME / SIMILAR IN SHOPS</div><div class="examples">`
        + d.matches.map(m=>`<a class="ex" href="${esc(m.url)}" target="_blank" rel="noopener">${m.image?`<img src="${esc(m.image)}" alt="">`:`<span style="width:44px"></span>`}<span class="t"><b>${esc(m.source||"")}</b><br><span style="color:var(--muted)">${esc(m.title||"")}</span></span>${m.price?`<span class="p">${esc(m.price)}</span>`:""}</a>`).join("")
        + `</div>`;
      lensBtn.style.display="none";
    } catch(e){ lensBtn.disabled=false; lensBtn.innerHTML=o; alert(e.message); }
  });

  // On-demand reverse image search (Google Vision) — only runs when tapped.
  const webBtn = el.querySelector(".webbtn"), webOut = el.querySelector(".webresults");
  webBtn.addEventListener("click", async ()=>{
    if(!img){ alert("No photo saved for this card — scan again to use this."); return; }
    webBtn.disabled=true; const o=webBtn.innerHTML; webBtn.textContent="Searching the web…";
    try {
      const r = await fetch("/api/web",{ method:"POST", headers:{ "content-type":"application/json", "x-flipscan-secret":getSecret() }, body: JSON.stringify({ image: img }) });
      if(r.status===401){ localStorage.removeItem("flipscan_secret"); throw new Error("Access code rejected — scan again to re-enter."); }
      const d = await r.json();
      if(!r.ok || d.error) throw new Error(prettyErr(d.error) || "reverse image search failed");
      if((!d.pages || !d.pages.length) && !d.best_guess){ webBtn.disabled=false; webBtn.textContent="Nothing matched online — try a clearer photo"; return; }
      webOut.innerHTML = `<div class="diglabel" style="margin:12px 0 8px">SPOTTED AROUND THE WEB</div>`
        + (d.best_guess ? `<div class="notes" style="font-style:normal;margin-bottom:8px">Looks like <b>${esc(d.best_guess)}</b></div>` : "")
        + (d.pages&&d.pages.length ? `<div class="examples">`+d.pages.map(p=>`<a class="ex" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="t"><b>${esc(p.site)}</b><br><span style="color:var(--muted)">${esc(p.title)}</span></span>${p.full?`<span class="p" style="font-size:.62rem;color:var(--good)">exact</span>`:`<span class="p" style="font-size:.62rem;color:var(--faint)">similar</span>`}</a>`).join("")+`</div>` : `<div class="notes" style="font-style:normal">No exact source pages found.</div>`);
      webBtn.style.display="none";
    } catch(e){ webBtn.disabled=false; webBtn.innerHTML=o; alert(e.message); }
  });

  // Log a purchase to the history (Upstash). Captures estimate-at-scan + what you paid.
  const logBtn = el.querySelector(".logbtn");
  logBtn.addEventListener("click", async ()=>{
    const paid = parseFloat(input.value);
    logBtn.disabled = true; logBtn.textContent = "Saving…";
    try {
      const record = { brand:id.brand, item_type:id.item_type, era:id.era, confidence:id.confidence,
        basis, price_source: priceSource, est_eur: resaleEur!=null?Math.round(resaleEur):null,
        band_low: bandLow!=null?Math.round(bandLow):null, band_high: bandHigh!=null?Math.round(bandHigh):null,
        paid: isFinite(paid)?paid:null, logged_at: new Date().toISOString().slice(0,10), bought:true };
      const r = await fetch("/api/log",{ method:"POST", headers:{ "content-type":"application/json", "x-flipscan-secret":getSecret() }, body: JSON.stringify({ action:"save", record }) });
      if(r.status===401){ localStorage.removeItem("flipscan_secret"); throw new Error("Access code rejected — scan again to re-enter."); }
      const d = await r.json(); if(!r.ok || d.error) throw new Error(prettyErr(d.error) || "save failed");
      logBtn.textContent = "✓ Saved to Flips"; logBtn.classList.add("saved");
    } catch(e){ logBtn.disabled=false; logBtn.textContent="Log it as bought"; alert(e.message); }
  });
}
</script>
</body>
</html>
