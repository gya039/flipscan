<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlipScan</title>
<style>
  :root{
    --bg:#15171C;--surface:#1E222B;--surface-2:#272C37;--ink:#ECEEF1;--muted:#99A0AC;--faint:#6B7280;
    --line:#2E3440;--line-strong:#3A414F;--accent:#C6F24E;--good:#4ADE80;--warn:#F5B700;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:1.6rem;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
  .shoot{margin-top:20px;display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#15171C;
    font-weight:800;font-size:1.05rem;padding:18px;cursor:pointer;text-align:center}
  .shoot:active{transform:translateY(1px)}
  input[type=file]{display:none}
  .hint{color:var(--faint);font-size:.78rem;text-align:center;margin-top:10px}

  .preview{margin-top:18px;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:none}
  .preview img{display:block;width:100%;max-height:320px;object-fit:cover}

  .status{margin-top:18px;color:var(--muted);font-size:.92rem;display:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}

  .card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:none}
  .id-brand{font-size:1.35rem;font-weight:800}
  .id-sub{color:var(--muted);font-size:.95rem;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:.74rem;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--ink)}
  .chip .l{color:var(--faint)}
  .conf{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
  .conf.high{background:#16331f;color:var(--good)} .conf.medium{background:#3a3417;color:var(--warn)} .conf.low{background:#3a2020;color:#e0707c}
  .flag{margin-top:12px;background:#3a3417;color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.84rem}

  .band{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .band-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  .band-row{display:flex;align-items:baseline;gap:14px;margin-top:8px}
  .band-med{font-size:2rem;font-weight:800;color:var(--accent);line-height:1}
  .band-lohi{color:var(--muted);font-size:.9rem}
  .band-meta{color:var(--faint);font-size:.76rem;margin-top:4px}
  .examples{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .ex{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;text-decoration:none;color:var(--ink)}
  .ex img{width:46px;height:46px;border-radius:7px;object-fit:cover;background:var(--line);flex:none}
  .ex .t{font-size:.82rem;line-height:1.25;max-height:2.5em;overflow:hidden}
  .ex .p{font-size:.8rem;color:var(--accent);white-space:nowrap;margin-left:auto;font-weight:700}

  .links{margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .links a{text-align:center;text-decoration:none;font-weight:700;font-size:.82rem;padding:11px 6px;border-radius:10px;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface-2)}
  .links a small{display:block;font-weight:400;color:var(--faint);font-size:.64rem;margin-top:2px}
  .err{margin-top:16px;background:#3a2020;color:#e0707c;border-radius:10px;padding:12px;font-size:.85rem;display:none}
  footer{margin-top:28px;color:var(--faint);font-size:.72rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Flip<span>Scan</span></h1>
  <div class="sub">Snap an item → what it is + what it sells for.</div>

  <label class="shoot" for="file">📷 Scan an item</label>
  <input id="file" type="file" accept="image/*" capture="environment">
  <div class="hint">Tip: include a shot of the brand/wash label — it dates the piece.</div>

  <div class="preview" id="preview"><img id="previewImg" alt=""></div>
  <div class="status" id="status"><span class="spin"></span><span id="statusText">Reading the item…</span></div>
  <div class="err" id="err"></div>

  <div class="card" id="result"></div>

  <footer>Gives a comparable price range, not an exact match — every vintage piece is unique. Check the sold-listings links to confirm.</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

$("file").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  $("err").style.display = "none";
  $("result").style.display = "none";
  const dataUrl = await resize(f, 1024, 0.82);
  $("previewImg").src = dataUrl;
  $("preview").style.display = "block";
  $("status").style.display = "block";
  try {
    const res = await fetch("/api/scan", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ image: dataUrl }),
    });
    const data = await res.json();
    $("status").style.display = "none";
    if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
    render(data);
  } catch (err) {
    $("status").style.display = "none";
    $("err").textContent = "Couldn't scan: " + err.message;
    $("err").style.display = "block";
  }
});

// shrink + compress client-side so uploads are small, fast and cheap
function resize(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      if (Math.max(w, h) > max) { const r = max / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(data) {
  const id = data.identity || {};
  const q = encodeURIComponent(id.search_query || [id.brand, id.item_type, id.era].filter(Boolean).join(" "));
  const conf = (id.confidence || "low").toLowerCase();
  let html = "";

  html += `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
    <div><div class="id-brand">${esc(id.brand || "Unknown")}</div>
    <div class="id-sub">${esc(id.item_type || "")} ${id.era && id.era!=="unknown" ? "· "+esc(id.era) : ""}</div></div>
    <span class="conf ${conf}">${esc(conf)} conf</span></div>`;

  const chips = [];
  if (id.key_features) chips.push(`<span class="chip"><span class="l">look</span> ${esc(id.key_features)}</span>`);
  if (id.size && id.size!=="unknown") chips.push(`<span class="chip"><span class="l">size</span> ${esc(id.size)}</span>`);
  if (id.condition_notes) chips.push(`<span class="chip"><span class="l">condition</span> ${esc(id.condition_notes)}</span>`);
  if (chips.length) html += `<div class="chips">${chips.join("")}</div>`;

  if (id.authenticity_flags && id.authenticity_flags.toLowerCase() !== "none")
    html += `<div class="flag">⚠️ Authenticity: ${esc(id.authenticity_flags)}</div>`;

  const c = data.comps;
  if (c && !c.error && c.count > 0) {
    html += `<div class="band"><div class="band-h">${esc(c.source)} · ${c.count} found</div>
      <div class="band-row"><div class="band-med">${fmt(c.median, c.currency)}</div>
      <div class="band-lohi">range ${fmt(c.low,c.currency)} – ${fmt(c.high,c.currency)}</div></div>
      <div class="band-meta">median of comparable listings — asking prices, verify against SOLD below</div>`;
    if (c.examples && c.examples.length) {
      html += `<div class="examples">` + c.examples.map(ex => `
        <a class="ex" href="${esc(ex.url)}" target="_blank" rel="noopener">
          ${ex.image ? `<img src="${esc(ex.image)}" alt="">` : `<div class="ex" style="width:46px;height:46px"></div>`}
          <span class="t">${esc(ex.title)}</span><span class="p">${esc(ex.price)}</span></a>`).join("") + `</div>`;
    }
    html += `</div>`;
  } else if (c && c.error) {
    html += `<div class="band"><div class="band-meta">Price lookup unavailable (${esc(c.error).slice(0,80)}). Use the search links below.</div></div>`;
  } else {
    html += `<div class="band"><div class="band-meta">Auto price-band not set up yet — add eBay keys to enable. For now, tap the search links:</div></div>`;
  }

  html += `<div class="links">
    <a href="https://www.ebay.co.uk/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1" target="_blank" rel="noopener">eBay<small>sold</small></a>
    <a href="https://www.vinted.ie/catalog?search_text=${q}&order=price_high_to_low" target="_blank" rel="noopener">Vinted<small>listings</small></a>
    <a href="https://www.depop.com/search/?q=${q}" target="_blank" rel="noopener">Depop<small>listings</small></a>
  </div>`;

  $("result").innerHTML = html;
  $("result").style.display = "block";
}

function fmt(v, cur) {
  if (v == null) return "—";
  const sym = cur === "EUR" ? "€" : cur === "USD" ? "$" : cur === "GBP" ? "£" : "";
  return sym + Math.round(v);
}
</script>
</body>
</html>
